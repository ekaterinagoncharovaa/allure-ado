name: Webinar 1 Playwright Allure Report

on:
  workflow_dispatch:
    inputs:
      publish_to_pages:
        description: Publish the generated Allure report to GitHub Pages
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - webinars/1/PWALLURE/**
      - .github/workflows/webinar-1-playwright-allure-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright tests with Allure 3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webinars/1/PWALLURE
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webinars/1/PWALLURE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests with Allure 3
        run: npx allure run -- npx playwright test --project=chromium
        continue-on-error: true

      - name: Package Allure report for Pages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_pages }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: webinars/1/PWALLURE/allure-report

  deploy:
    name: Deploy Allure report to Pages
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_pages }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
